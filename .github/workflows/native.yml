name: Native Outlook candidate
on: [pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  native:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.x'
      - run: npm ci
      - run: npm test
      - name: Read reviewed core pin
        id: core
        shell: bash
        run: |
          node --input-type=module -e 'import fs from "node:fs"; const p=JSON.parse(fs.readFileSync("core-source.json")); if(!/^[A-Za-z0-9_.-]+\/[A-Za-z0-9_.-]+$/.test(p.repository)||!/^[a-f0-9]{40}$/.test(p.ref)) throw new Error("Pin reviewed core first"); fs.appendFileSync(process.env.GITHUB_OUTPUT,`repository=${p.repository}\nref=${p.ref}\n`);'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ steps.core.outputs.repository }}
          ref: ${{ steps.core.outputs.ref }}
          path: .core-checkout
          persist-credentials: false
      - run: npm run build:native -- --core .core-checkout --release --locked
      - name: Verify Windows executable
        shell: pwsh
        run: |
          $bytes = [IO.File]::ReadAllBytes("dist/LocalCorrect-Outlook-Setup.exe")
          if ($bytes[0] -ne 0x4d -or $bytes[1] -ne 0x5a) { throw "Not a PE executable" }
          [Reflection.AssemblyName]::GetAssemblyName((Resolve-Path "dist/LocalCorrect-Outlook-Setup.exe"))
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-outlook-candidate
          path: |
            dist/LocalCorrect-Outlook-Setup.exe
            dist/LocalCorrect-Outlook-Setup.exe.sha256
# Build and engine tests only. A hosted runner without Outlook is not COM/Office acceptance.
